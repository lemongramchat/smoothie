<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smoothie Blender Game</title>
  <link rel="stylesheet" href="style.css">
 </head>
<body>
  <div id="ui">
    <h1>Smoothie Blender</h1>
    <div id="controls">
      <button id="blendBtn">Blend</button>
      <button id="resetBtn">Reset</button>
      <label>Blend time: <input id="blendTime" type="range" min="0.5" max="6" step="0.1" value="2"></label>
      <label>Fruit limit: <input id="maxFruits" type="number" min="1" max="10" value="5" style="width:60px"></label>
    </div>
    <p>Drag the fruit icons into the blender, then press Blend.</p>
  </div>

  <aside id="fruit-panel">
    <h3>Fruits</h3>
    <div class="fruit" data-fruit="banana" aria-label="banana" style="background:#ffe680">🍌</div>
    <div class="fruit" data-fruit="strawberry" aria-label="strawberry" style="background:#ff6b89">🍓</div>
    <div class="fruit" data-fruit="blueberry" aria-label="blueberry" style="background:#6f8cff">🫐</div>
    <div class="fruit" data-fruit="spinach" aria-label="spinach" style="background:#6cc66c">🥬</div>
    <div class="fruit" data-fruit="mango" aria-label="mango" style="background:#ffba4d">🥭</div>
  </aside>

  <canvas id="game"></canvas>
  <script src="main.js"></script>
</body>
</html>
